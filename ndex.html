<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Demo Contact Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f2ee;
        --surface: #ffffff;
        --ink: #1c1a17;
        --ink-soft: #5c564d;
        --line: #e3ded4;
        --warn-bg: #f7b500;
        --warn-ink: #241a00;
        --danger: #d21f3c;
        --danger-dark: #a8122c;
        --shadow: 0 18px 40px rgba(28, 26, 23, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121110;
          --surface: #1d1b19;
          --ink: #f2efe9;
          --ink-soft: #b3aa9d;
          --line: #35312c;
          --warn-bg: #f7b500;
          --warn-ink: #241a00;
          --danger: #e5324f;
          --danger-dark: #c22440;
          --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 28px 16px 48px;
      }
      main {
        width: 100%;
        max-width: 460px;
      }
      .warn {
        background: var(--warn-bg);
        color: var(--warn-ink);
        border-radius: 14px;
        padding: 18px 18px 16px;
        text-align: center;
        box-shadow: var(--shadow);
      }
      .warn .signs {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .warn .signs svg { width: 30px; height: 30px; display: block; }
      .warn h1 {
        margin: 0;
        font-size: 1.4rem;
        line-height: 1.35;
        font-weight: 800;
      }
      .warn p {
        margin: 6px 0 0;
        font-size: 0.98rem;
        font-weight: 500;
      }
      .of-logo {
        margin-top: 22px;
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 10px 18px;
        box-shadow: var(--shadow);
      }
      .of-logo img {
        display: block;
        width: 100%;
        height: auto;
      }
      .demo-list {
        margin-top: 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .demo-btn {
        appearance: none;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 14px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      .demo-btn:active { transform: scale(0.985); }
      .demo-btn:focus-visible { outline: 3px solid var(--warn-bg); outline-offset: 2px; }
      .brand-ic {
        flex: 0 0 auto;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .brand-ic svg { width: 26px; height: 26px; display: block; }
      .ic-whatsapp { background: #25d366; }
      .ic-telegram { background: #229ed9; }
      .ic-onlyfans { background: #00aff0; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em; }
      .demo-btn .name {
        font-size: 1.12rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .demo-tag {
        margin-left: auto;
        flex: 0 0 auto;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-soft);
        border: 1px dashed var(--ink-soft);
        border-radius: 999px;
        padding: 3px 10px;
      }
      .demo-note {
        min-height: 1.5em;
        margin: 12px 4px 0;
        text-align: center;
        font-size: 0.95rem;
        color: var(--ink-soft);
      }
      .enter-wrap { margin-top: 30px; text-align: center; }
      .age-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 74px;
        height: 74px;
        border-radius: 50%;
        border: 4px solid var(--danger);
        color: var(--danger);
        font-weight: 800;
        font-size: 1.35rem;
        background: var(--surface);
        margin-bottom: 16px;
      }
      .enter-btn {
        display: block;
        width: 100%;
        background: var(--danger);
        color: #fff;
        text-decoration: none;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 18px 16px;
        border-radius: 14px;
        box-shadow: var(--shadow);
        transition: background 0.15s ease, transform 0.12s ease;
      }
      .enter-btn:hover { background: var(--danger-dark); }
      .enter-btn:active { transform: scale(0.985); }
      .enter-btn:focus-visible { outline: 3px solid var(--warn-bg); outline-offset: 3px; }
      .enter-sub {
        margin: 10px 0 0;
        font-size: 0.92rem;
        color: var(--ink-soft);
      }
    </style>
  </head>
