<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Official Links & Support</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f1115;
        --surface: #181b22;
        --surface-hover: #212530;
        --ink: #ffffff;
        --ink-soft: #9aa0ae;
        --line: #2d3342;
        --primary: #0088cc;
        --primary-gradient: linear-gradient(135deg, #0088cc 0%, #229ed9 100%);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 16px;
        background-image: radial-gradient(circle at 50% 0%, #1a2236 0%, #0f1115 70%);
      }
      main {
        width: 100%;
        max-width: 440px;
        text-align: center;
      }
      /* Profile Section */
      .profile-section {
        margin-bottom: 28px;
      }
      .avatar-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 16px;
      }
      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--primary);
        box-shadow: 0 0 20px rgba(0, 136, 204, 0.4);
      }
      .verified-badge {
        position: absolute;
        bottom: 2px;
        right: 2px;
        background: #0088cc;
        color: #fff;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--bg);
      }
      .verified-badge svg { width: 14px; height: 14px; }
      
      h1 {
        margin: 0 0 6px;
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .bio {
        margin: 0;
        font-size: 0.92rem;
        color: var(--ink-soft);
        font-weight: 500;
      }

      /* Links List */
      .links-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .link-btn {
        appearance: none;
        width: 100%;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        border-radius: 16px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        cursor: pointer;
        font-family: inherit;
        text-align: left;
        text-decoration: none;
        box-shadow: var(--shadow);
        transition: all 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .link-btn:hover {
        background: var(--surface-hover);
        border-color: var(--primary);
        transform: translateY(-2px);
      }
      .link-btn:active { transform: scale(0.98); }
      
      .brand-ic {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
      }
      .brand-ic svg { width: 24px; height: 24px; display: block; }
      .ic-whatsapp { background: linear-gradient(135deg, #25d366 0%, #1ebe5d 100%); }
      .ic-telegram { background: linear-gradient(135deg, #229ed9 0%, #1785bc 100%); }
      
      .link-info {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .link-info .name {
        font-size: 1.05rem;
        font-weight: 700;
      }
      .link-info .desc {
        font-size: 0.82rem;
        color: var(--ink-soft);
      }
      .arrow-icon {
        color: var(--ink-soft);
        transition: transform 0.2s ease;
      }
      .link-btn:hover .arrow-icon {
        transform: translateX(4px);
        color: var(--ink);
      }

      /* Footer Trust note */
      .footer-note {
        margin-top: 32px;
        font-size: 0.8rem;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Profile Header -->
      <div class="profile-section">
        <div class="avatar-wrapper">
          <!-- আপনার প্রোফাইল ছবি বা লোগো এখানে দিতে পারেন -->
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" alt="Profile" class="avatar" />
          <div class="verified-badge" title="Verified Account">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
        </div>
        <h1>Official Support Hub</h1>
        <p class="bio">Connect with our team securely via official channels below.</p>
      </div>
      
      <!-- Links Container -->
      <div class="links-list">
        <!-- WhatsApp Link -->
        <a href="https://asiafilm.org/4/0b92cbc1f526a5c1e54b6385bcfb290e" target="_blank" rel="noopener noreferrer" class="link-btn">

          </span>
          <div class="link-info">
            <span class="name">WhatsApp Support</span>
            <span class="desc">Fast response via chat</span>
          </div>
          <span class="arrow-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>

        <!-- Telegram Link -->
        <a href="https://asiafilm.org/4/0b92cbc1f526a5c1e54b6385bcfb290e" target="_blank" rel="noopener noreferrer" class="link-btn">
          <span class="brand-ic ic-telegram" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.4 18.8 19c-.23 1.03-.85 1.28-1.72.8l-4.76-3.51-2.3 2.21c-.25.26-.47.47-.96.47l.35-4.93 8.97-8.1c.39-.35-.09-.54-.6-.2L6.6 13.34 1.83 11.85c-1.04-.32-1.06-1.04.22-1.54L20.7 3.1c.86-.32 1.62.2 1.2 1.3Z"/></svg>
          </span>
          <div class="link-info">
            <span class="name">Telegram Channel</span>
            <span class="desc">Join our official community</span>
          </div>
          <span class="arrow-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </span>
        </a>
      </div>

      <div class="footer-note">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Secure & Verified Connection</span>
      </div>
    </main>
  </body>
</html>
